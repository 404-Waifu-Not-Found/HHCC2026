<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClipQuest — DeepSeek configuration</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <picture class="brand-lockup">
          <source
            media="(prefers-color-scheme: dark)"
            srcset="brand/clipquest-lockup-on-dark.png"
          />
          <img src="brand/clipquest-lockup-on-light.png" alt="ClipQuest" />
        </picture>
      </header>
      <form id="deepseek-config" class="config" aria-labelledby="config-title">
        <div class="config-copy">
          <p class="eyebrow">DeepSeek</p>
          <h1 id="config-title">DeepSeek configuration</h1>
          <p>
            Add the API key ClipQuest uses for private quiz generation in this
            browser.
          </p>
        </div>
        <label for="api-key">DeepSeek API key</label>
        <input
          id="api-key"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="sk-…"
        />
        <p class="privacy">
          Stored only in Chrome's local extension storage. The ClipQuest website
          and servers never receive your key.
        </p>
        <div class="actions">
          <button id="save" class="primary" type="submit" disabled>
            Save &amp; test
          </button>
          <button id="remove" class="secondary" type="button" disabled>
            Remove key
          </button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
