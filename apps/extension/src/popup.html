<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClipQuest Local AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <picture class="brand-lockup">
          <source
            media="(prefers-color-scheme: dark)"
            srcset="brand/clipquest-lockup-on-dark.png"
          />
          <img src="brand/clipquest-lockup-on-light.png" alt="ClipQuest" />
        </picture>
        <div class="brand-edition">Local AI</div>
        <p>Private quiz generation from this browser.</p>
      </header>
      <section class="tool">
        <div>
          <h2>Generate a concept quiz</h2>
          <p>
            Reads captions, removes timestamps, then sends the complete plain
            text directly to DeepSeek from this extension.
          </p>
        </div>
        <label for="youtube-url">YouTube URL</label>
        <input
          id="youtube-url"
          type="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://youtube.com/watch?v=…"
        />
        <div class="actions">
          <button id="generate-quiz" class="primary">Generate quiz JSON</button>
          <button id="download-text" class="secondary">Download .txt</button>
        </div>
      </section>
      <div class="divider"></div>
      <label for="api-key">DeepSeek API key</label>
      <input
        id="api-key"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="sk-…"
      />
      <p class="privacy">
        Stored only in Chrome's local extension storage. The ClipQuest website
        and servers never receive your key.
      </p>
      <div class="actions">
        <button id="save" class="primary">Save &amp; test</button>
        <button id="remove" class="secondary">Remove key</button>
      </div>
      <button id="reload" class="secondary">Reload extension update</button>
      <p id="version" class="version"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <pre id="quiz-output" hidden></pre>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
